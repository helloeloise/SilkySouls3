name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SilkySouls3.sln

      - name: Build
        run: msbuild SilkySouls3.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilkySouls3-${{ github.sha }}
          path: SilkySouls3/bin/Release/**
